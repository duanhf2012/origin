log:
  console: {enabled: true, level: info, format: text}
discovery:
  type: etcd
  etcd:
    endpoints: [http://127.0.0.1:2379]
    # etcd 发现数据所属和监听的网络分区，不是 Node 的 region 标签。
    local_network: cn-east
    ttl: 5s
    request_timeout: 3s
nodes:
  - id: game-1
    # Node 对外发布的键值标签；等价于分行写法 region: cn-east。
    labels: {region: cn-east}
    services: [Service]
  - id: game-2
    labels: {region: cn-east}
    services: [Service]
