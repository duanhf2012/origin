log:
  mode: async
  console: {enabled: true, level: info, format: text}
nodes:
  - id: redis-collections-1
    services: [CollectionService]
services:
  CollectionService:
    redis:
      # 可选，默认 standalone；生产必须按实际拓扑选择 standalone/sentinel/cluster。
      mode: standalone
      # 必填；Standalone 只能有一个 host:port，凭证不要写在地址中。
      addresses: ["${ORIGIN_REDIS_ADDRESS}"]
      # 可选，默认 RESP3；只有旧代理不兼容时才使用 2。
      protocol: 3
      # 可选，默认 0；Cluster 只支持 0。
      database: 0
      # 可选，默认均为 5s；请求 Context 应按业务 SLA 设置更短的上限。
      read_timeout: 5s
      write_timeout: 5s
      # 可选，默认 6s；在线服务建议从 500ms～2s 起步并监控池等待。
      pool_timeout: 500ms
      # 可选，0 按拓扑和 GOMAXPROCS 计算；生产按副本数、QPS 和 Redis 连接预算压测。
      pool_size: 16
      # 可选，0 取 pool_size；这是每节点连接硬上限。
      max_active_connections: 16
      # 可选，默认 0；仅确认命令幂等并接受延迟放大后才开启自动重试。
      max_retries: 0
