log:
  mode: async
  console: {enabled: true, level: info, format: text}
nodes:
  - id: redis-atomic-1
    services: [AtomicService]
services:
  AtomicService:
    redis:
      # 可选，默认 standalone；生产必须按实际拓扑选择 standalone/sentinel/cluster。
      mode: standalone
      # 必填；Standalone 只能有一个 host:port。Cluster 多 Key 示例需使用相同 Hash Tag。
      addresses: ["${ORIGIN_REDIS_ADDRESS}"]
      # 可选，默认 RESP3；只有旧代理不兼容时才使用 2。
      protocol: 3
      # 可选，默认 0；Cluster 只支持 0。
      database: 0
      # 可选，默认均为 5s；Watch/Lua 仍必须由调用 Context 限定总时间。
      read_timeout: 5s
      write_timeout: 5s
      # 可选，默认 6s；在线服务建议从 500ms～2s 起步并监控池等待。
      pool_timeout: 500ms
      # 可选，0 按拓扑和 GOMAXPROCS 计算；生产需核算每节点、每副本总连接数。
      pool_size: 16
      # 可选，0 取 pool_size；这是每节点连接硬上限。
      max_active_connections: 16
      # 可选，默认 0；示例的 Watch 冲突重试由业务有界控制，不叠加 Driver 命令重试。
      max_retries: 0
