log:
  mode: async
  console: {enabled: true, level: info, format: text}
nodes:
  - id: redis-lock-1
    services: [LockService]
services:
  LockService:
    redis:
      # 可选，默认 standalone；生产必须按实际拓扑选择 standalone/sentinel/cluster。
      mode: standalone
      # 必填；Standalone 只能有一个 host:port。锁 Key 在 Cluster 中也应使用稳定 Hash Tag。
      addresses: ["${ORIGIN_REDIS_ADDRESS}"]
      # 可选，默认 RESP3；只有旧代理不兼容时才使用 2。
      protocol: 3
      # 可选，默认 0；Cluster 只支持 0。
      database: 0
      # 可选，默认 5s；内网通常从 2s～5s 起步，必须覆盖正常 DNS/TLS 建连。
      dial_timeout: 5s
      # 可选，默认均为 5s；锁等待还受业务 ctx 和 waitTimeout 的更早边界限制。
      read_timeout: 5s
      write_timeout: 5s
      # 可选，默认 6s；在线服务建议从 500ms～2s 起步并监控池等待。
      pool_timeout: 500ms
      # 可选，0 按拓扑和 GOMAXPROCS 计算；生产需核算每节点、每副本总连接数。
      pool_size: 16
      # 可选，0 取 pool_size；这是每节点连接硬上限。
      max_active_connections: 16
      # 可选，默认 0；锁脚本不叠加透明命令重试，业务依靠 Token、TTL 和最终幂等。
      max_retries: 0
