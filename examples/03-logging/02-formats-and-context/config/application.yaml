log:
  mode: sync
  console:
    enabled: true
    level: info
    format: text
    context_fields:
      # 控制台显示 Node，隐藏 Service，得到较短的人工可读前缀。
      node_id: true
      service_name: false
  file:
    enabled: true
    level: info
    format: json
    # Application 名 format-context 会自动加到文件名前，实际文件是 format-context-origin.log。
    path: examples/03-logging/02-formats-and-context/logs/origin.log
    context_fields:
      # 文件同时保留 Node 和 Service，便于日志平台筛选。
      node_id: true
      service_name: true
    rotation:
      max_size: 10M
      by_date: true
      timezone: Local
    retention:
      max_age: 7d
      max_files: 10
      compress: true

nodes:
  - id: game-1
    services: [FormatService]
