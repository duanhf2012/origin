log:
  console: {enabled: true, level: info, format: text}

discovery:
  type: origin
  origin:
    ttl: 5s
    server:
      node: discovery-1

# 传输参数由整个 Application 共享；TCP 地址仍由每个 Node 单独声明。
rpc:
  transport: tcp
  tcp: {}

nodes:
  - id: discovery-1
    rpc:
      tcp: {listen: 127.0.0.1:18080, advertise: 127.0.0.1:18080}
    services: [DiscoveryService]
  - id: player-1
    rpc:
      tcp: {listen: 127.0.0.1:18101, advertise: 127.0.0.1:18101}
    services: [PlayerService]
  - id: gateway-1
    rpc:
      tcp: {listen: 127.0.0.1:18102, advertise: 127.0.0.1:18102}
    services: [GatewayService]
