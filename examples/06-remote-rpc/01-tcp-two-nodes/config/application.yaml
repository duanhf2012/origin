log:
  console: {enabled: true, level: info, format: text}

discovery:
  type: origin
  origin:
    ttl: 5s
    server:
      node: discovery-1
      listen: 127.0.0.1:18080
      address: 127.0.0.1:18080

nodes:
  - id: discovery-1
    services: [DiscoveryService]
  - id: player-1
    rpc:
      transport: tcp
      tcp: {listen: 127.0.0.1:18101, advertise: 127.0.0.1:18101}
    services: [PlayerService]
  - id: gateway-1
    rpc:
      transport: tcp
      tcp: {listen: 127.0.0.1:18102, advertise: 127.0.0.1:18102}
    services: [GatewayService]
